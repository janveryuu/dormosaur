plugins {
    id 'com.android.application'
}

def signingFile = rootProject.file('../.android-signing/signing.properties')
def signingProperties = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.dormly.dormosaur'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dormly.dormosaur'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'app_name', 'Dormosaur'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('../.android-signing/dormosaur-release.jks')
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.configureEach {
    if (name == 'validateSigningRelease') {
        doFirst {
            if (!signingFile.exists()) {
                throw new GradleException('Release signing is missing. See docs/android.md.')
            }
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
}
